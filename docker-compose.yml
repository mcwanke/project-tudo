services:
  tudo-ntfy:
    build: .
    restart: unless-stopped
    env_file: .env
    # TEMPORARY: -v enables debug logging to diagnose the midnight
    # habit-reminder-time bug. Remove once resolved (see commit history).
    command: ["-v"]
    ports:
      - "8787:8787"
    volumes:
      - tudo-ntfy-state:/data

volumes:
  tudo-ntfy-state:
